<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xMTK - Shop</title>
    <!-- Vinculamos el archivo CSS -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <h1>Tienda</h1>
    
    <div class="contenedor-productos">
        <!-- Los productos se cargarán dinámicamente desde main.js -->
    </div>

    <div id="carrito" class="carrito">
        <h2>Carrito</h2>
        <ul id="lista-carrito">
            <!-- Aquí se mostrarán los productos del carrito -->
        </ul>
        <p><strong>Total: $<span id="precio-total">0</span></strong></p>

        <!-- Botones adicionales -->
        <button id="vaciar-carrito" class="boton-vaciar">Vaciar Carrito</button>
        <button id="terminar-compra" class="boton-comprar">Terminar Compra</button>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
